version: "3.9"

# ── AI YouTube Automation — cloud-first stack ──────────────────────────────────
# No Ollama — uses Gemini (free tier) or OpenAI.
# Copy .env.example → .env and fill in GEMINI_API_KEY before starting.
#
# Quick start:
#   docker compose up api          # just the API server
#   docker compose up api worker   # API + background scheduler
#   docker compose --profile cli run cli python -m app.main create --topic "..."

services:

  # ── FastAPI REST API ──────────────────────────────────────────────────────────
  api:
    build: .
    container_name: yt-automation-api
    command: uvicorn app.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./assets:/app/assets
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
      - LOG_FORMAT=json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Autonomous scheduler worker ───────────────────────────────────────────────
  # Runs the 3-day video generation cron independently of the API.
  # Set SCHEDULER_ENABLED=true in .env to activate.
  worker:
    build: .
    container_name: yt-automation-worker
    command: python -m app.main scheduler start --now
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./assets:/app/assets
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
      - LOG_FORMAT=json
      - SCHEDULER_ENABLED=true
    restart: unless-stopped
    profiles:
      - worker  # only starts with: docker compose --profile worker up

  # ── One-off CLI commands ──────────────────────────────────────────────────────
  cli:
    build: .
    container_name: yt-automation-cli
    entrypoint: ["python", "-m", "app.main"]
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./assets:/app/assets
      - ./.env:/app/.env:ro
    profiles:
      - cli   # only starts with: docker compose --profile cli run cli <command>

volumes: {}

networks:
  default:
    driver: bridge
